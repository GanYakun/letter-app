<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <title>摄像头抓拍系统</title>
  <script src="./vue.js"></script>
  <script src="../node_modules/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #202124;
      color: #fff;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    .left-panel {
      flex: 3.5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    video,
    .black-screen {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background-color: black;
      object-fit: cover;
    }

    .flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      animation: flash 0.3s ease;
    }

    @keyframes flash {
      0% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
      }
    }

    .capture-button {
      margin-top: 10px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 24px;
      color: white;
      border: none;
      background-color: #dc3545;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .right-panel {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #444;
      padding: 16px;
      box-sizing: border-box;
    }

    .function-panel {
      flex: 1;
      background-color: #2d2f31;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .function-panel h3 {
      margin: 0;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .function-panel button {
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      background-color: #4a90e2;
      color: white;
      cursor: pointer;
    }

    .function-panel button:hover {
      background-color: #357ABD;
    }

    .preview-panel {
      flex: 2;
      background-color: #2d2f31;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      padding-top: 20px;
      padding-bottom: 10px;
    }

    .preview-panel img {
      max-width: 95%;
      max-height: 350px;
      border-radius: 6px;
      margin-bottom: 0;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      background: #222;
      display: block;
    }

    .capture-info {
      width: 95%;
      margin: 0 auto 12px auto;
      text-align: center;
      color: #fff;
      font-size: 17px;
      letter-spacing: 1px;
      font-weight: 500;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 0 0 6px 6px;
      padding: 10px 0 6px 0;
      min-height: 32px;
      box-sizing: border-box;
      position: relative;
      top: -4px;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(220, 53, 69, 0.9);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.5);
      border: none;
      color: white;
      font-size: 24px;
      width: 36px;
      height: 60px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      z-index: 2;
    }

    .nav-left {
      left: 5px;
    }

    .nav-right {
      right: 5px;
    }

    canvas {
      display: none;
    }

    .wait-msg-mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.25);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wait-msg-box {
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 24px 40px;
      border-radius: 8px;
      font-size: 18px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
    }

    /* 人员基础信息表格样式 */
    .basic-info-table {
      width: 100%;
      border-collapse: collapse;
      background: #222;
      color: #fff;
      margin-top: 10px;
    }

    .basic-info-table th,
    .basic-info-table td {
      padding: 8px;
      border: 1px solid #444;
      text-align: center;
    }

    .basic-info-table th {
      background-color: #333;
      font-weight: bold;
    }

    .basic-info-table tr:nth-child(even) {
      background-color: #2a2a2a;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 15px;
      gap: 5px;
    }

    .pagination button {
      padding: 5px 10px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .pagination button:disabled {
      background-color: #666;
      cursor: not-allowed;
    }

    .pagination span {
      align-self: center;
      margin: 0 10px;
    }

    /* 新增人员信息表单样式 */
    .add-person-form {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .add-person-form h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }

    .form-group label {
      width: 80px;
      color: #fff;
      margin-right: 10px;
    }

    .form-group input,
    .form-group select {
      flex: 1;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
    }

    .form-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .form-buttons button {
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background-color: #4a90e2;
      color: white;
    }

    .btn-secondary {
      background-color: #666;
      color: white;
    }

    /* 编辑表单样式 */
    .edit-person-form {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .edit-person-form h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #fff;
    }

    /* 隐藏的文件输入框 */
    .file-input {
      display: none;
    }

    /* 操作按钮样式 */
    .action-buttons {
      display: flex;
      gap: 5px;
      justify-content: center;
    }

    .action-buttons button {
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      border: none;
      font-size: 12px;
    }

    .btn-edit {
      background-color: #4a90e2;
      color: white;
    }

    .btn-save {
      background-color: #28a745;
      color: white;
    }

    .btn-cancel {
      background-color: #666;
      color: white;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- 等待提示 -->
    <div v-if="showWaitMsg" class="wait-msg-mask">
      <div class="wait-msg-box">正在识别人脸，请稍候...</div>
    </div>

    <!-- 左侧摄像区 -->
    <div class="left-panel">
      <template v-if="showProgressTable">
        <div
          style="width:100%;height:100%;overflow:auto;background:#232323;border-radius:8px;padding:18px 8px 8px 8px;">
          <h3 style="color:#fff;margin:0 0 12px 0;">识别情况</h3>
          <table style="width:100%;border-collapse:collapse;background:#222;color:#fff;">
            <thead>
              <tr style="background:#333;">
                <th style="padding:6px 8px;border:1px solid #444;">姓名</th>
                <th style="padding:6px 8px;border:1px solid #444;">工号</th>
                <th style="padding:6px 8px;border:1px solid #444;">相似度</th>
                <th style="padding:6px 8px;border:1px solid #444;">抓取时间</th>
                <th style="padding:6px 8px;border:1px solid #444;">识别时间</th>
                <th style="padding:6px 8px;border:1px solid #444;">图片地址</th>
                <th style="padding:6px 8px;border:1px solid #444;">原图地址</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="(row, idx) in progressTableData" :key="idx">
                <td style="padding:6px 8px;border:1px solid #444;">{{ row.name }}</td>
                <td style="padding:6px 8px;border:1px solid #444;">{{ row.jobId }}</td>
                <td style="padding:6px 8px;border:1px solid #444;">{{ row.similarity }}</td>
                <td style="padding:6px 8px;border:1px solid #444;">{{ row.captureTime }}</td>
                <td style="padding:6px 8px;border:1px solid #444;">{{ row.recognizeTime }}</td>
                <td style="padding:6px 8px;border:1px solid #444;max-width:120px;overflow:auto;">
                  <a :href="row.imgUrl" target="_blank" style="color:#4a90e2;">图片</a>
                </td>
                <td style="padding:6px 8px;border:1px solid #444;max-width:120px;overflow:auto;">
                  <a :href="row.originUrl" target="_blank" style="color:#4a90e2;">原图</a>
                </td>
              </tr>
            </tbody>
          </table>
          <button
            style="margin-top:18px;padding:8px 18px;background:#4a90e2;color:#fff;border:none;border-radius:4px;cursor:pointer;"
            @click="showProgressTable=false">返回</button>
        </div>
      </template>
      <template v-else-if="showBasicInfoTable">
        <div style="width:100%;height:100%;overflow:auto;background:#232323;border-radius:8px;padding:18px 8px 8px 8px;">
          <h3 style="color:#fff;margin:0 0 12px 0;">人员基础信息</h3>
          
          <!-- 新增人员信息表单 -->
          <div class="add-person-form" v-if="showAddPersonForm">
            <h3>新增人员信息</h3>
            <div class="form-group">
              <label>用户名:</label>
              <input type="text" v-model="newPerson.user_name" placeholder="请输入用户名">
            </div>
            <div class="form-group">
              <label>工号:</label>
              <input type="text" v-model="newPerson.job_num" placeholder="请输入工号">
            </div>
            <div class="form-group">
              <label>部门:</label>
              <input type="text" v-model="newPerson.dept" placeholder="请输入部门">
            </div>
            <div class="form-group">
              <label>周期:</label>
              <select v-model="newPerson.cycle">
                <option value="周">周</option>
                <option value="月">月</option>
                <option value="年">年</option>
              </select>
            </div>
            <div class="form-group">
              <label>是否在场:</label>
              <select v-model="newPerson.field">
                <option value="是">是</option>
                <option value="否">否</option>
              </select>
            </div>
            <div class="form-group">
              <label>开始日期:</label>
              <input type="date" v-model="newPerson.start_date">
            </div>
            <div class="form-group">
              <label>结束日期:</label>
              <input type="date" v-model="newPerson.end_date">
            </div>
            <div class="form-buttons">
              <button class="btn-secondary" @click="showAddPersonForm = false">取消</button>
              <button class="btn-primary" @click="addBasicInfo">保存</button>
            </div>
          </div>
          
          <!-- 编辑人员信息表单 -->
          <div class="edit-person-form" v-if="editingPerson.id">
            <h3>编辑人员信息</h3>
            <div class="form-group">
              <label>用户名:</label>
              <input type="text" v-model="editingPerson.user_name" placeholder="请输入用户名">
            </div>
            <div class="form-group">
              <label>工号:</label>
              <input type="text" v-model="editingPerson.job_num" placeholder="请输入工号">
            </div>
            <div class="form-group">
              <label>部门:</label>
              <input type="text" v-model="editingPerson.dept" placeholder="请输入部门">
            </div>
            <div class="form-group">
              <label>周期:</label>
              <select v-model="editingPerson.cycle">
                <option value="周">周</option>
                <option value="月">月</option>
                <option value="年">年</option>
              </select>
            </div>
            <div class="form-group">
              <label>是否在场:</label>
              <select v-model="editingPerson.field">
                <option value="是">是</option>
                <option value="否">否</option>
              </select>
            </div>
            <div class="form-group">
              <label>开始日期:</label>
              <input type="date" v-model="editingPerson.start_date">
            </div>
            <div class="form-group">
              <label>结束日期:</label>
              <input type="date" v-model="editingPerson.end_date">
            </div>
            <div class="form-buttons">
              <button class="btn-secondary" @click="cancelEdit">取消</button>
              <button class="btn-primary" @click="updateBasicInfo">保存</button>
            </div>
          </div>
          
          <!-- 操作按钮 -->
          <div style="margin-bottom: 10px;">
            <button 
              style="padding: 6px 12px; background-color: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px;"
              @click="showAddPersonForm = !showAddPersonForm">
              {{ showAddPersonForm ? '取消新增' : '新增人员' }}
            </button>
            
            <button 
              style="padding: 6px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;"
              @click="triggerImport">
              导入
            </button>
            
            <button 
              style="padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;"
              @click="deleteSelectedItems"
              :disabled="selectedItems.length === 0">
              删除 ({{ selectedItems.length }})
            </button>
            
            <!-- 隐藏的文件输入框 -->
            <input type="file" ref="fileInput" class="file-input" @change="handleFileImport" accept=".xlsx">
          </div>
          
          <table class="basic-info-table">
            <thead>
              <tr>
                <th style="width: 40px;">
                  <input 
                    type="checkbox" 
                    @change="toggleSelectAll" 
                    :checked="selectedItems.length > 0 && selectedItems.length === basicInfoData.length">
                </th>
                <th>ID</th>
                <th>用户名</th>
                <th>工号</th>
                <th>部门</th>
                <th>是否在场</th>
                <th>周期</th>
                <th>开始日期</th>
                <th>结束日期</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="item in basicInfoData" :key="item.id">
                <td style="text-align: center;">
                  <input 
                    type="checkbox" 
                    :value="item.id" 
                    v-model="selectedItems"
                    @change="updateSelectAllState">
                </td>
                <td>{{ item.id }}</td>
                <td>{{ item.user_name }}</td>
                <td>{{ item.job_num }}</td>
                <td>{{ item.dept }}</td>
                <td>{{ item.field }}</td>
                <td>{{ item.cycle }}</td>
                <td>{{ item.start_date }}</td>
                <td>{{ item.end_date }}</td>
                <td>
                  <div class="action-buttons">
                    <button class="btn-edit" @click="startEdit(item)">编辑</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          
          <!-- 分页控件 -->
          <div class="pagination">
            <button @click="fetchBasicInfo(currentPage-1)" :disabled="currentPage <= 1">上一页</button>
            <span>第 {{ currentPage }} 页，共 {{ totalPages }} 页</span>
            <button @click="fetchBasicInfo(currentPage+1)" :disabled="currentPage >= totalPages">下一页</button>
          </div>
          
          <button
            style="margin-top:18px;padding:8px 18px;background:#4a90e2;color:#fff;border:none;border-radius:4px;cursor:pointer;"
            @click="showBasicInfoTable=false">返回</button>
        </div>
      </template>
      <template v-else>
        <video ref="video" v-show="cameraAvailable" autoplay></video>
        <div class="black-screen" v-show="!cameraAvailable"></div>
        <div v-if="showFlash" class="flash-overlay"></div>
        <button class="capture-button" @click="capturePhoto" title="抓拍照片">
          <i class="fas fa-camera"></i>
        </button>
      </template>
    </div>

    <!-- 右侧控制区 -->
    <div class="right-panel">
      <!-- 操作功能 -->
      <div class="function-panel">
        <h3><i class="fas fa-tools"></i> 功能操作</h3>

        <button @click="triggerRegister">人像注册</button>
        <!-- 人像注册弹窗 -->
        <div v-if="showRegisterDialog" class="wait-msg-mask" style="z-index:10000;">
          <div class="wait-msg-box" style="min-width:320px;">
            <h3 style="margin-top:0;">人像注册</h3>
            <div style="margin-bottom:12px;">
              <label>姓名：</label>
              <input v-model="registerName" style="width:180px;" />
            </div>
            <div style="margin-bottom:18px;">
              <label>工号：</label>
              <input v-model="registerJobId" style="width:180px;" />
            </div>
            <div style="text-align:right;">
              <button @click="confirmRegister" style="margin-right:12px;">确定</button>
              <button @click="cancelRegister">取消</button>
            </div>
          </div>
        </div>

        <button @click="importAttendance">导入考勤表</button>
        <button @click="checkProgressIdentification">查看识别情况</button>
        <button @click="downloadExcel">下载Excel</button>
        <button @click="checkPartyInfo">人员基础信息</button>
        <button @click="toggleFullscreen">切换全屏</button>
      </div>

      <!-- 文件列表 -->
      <div class="file-list" v-if="fileNames.length > 0">
        <h4>已导入文件:</h4>
        <ul>
          <li v-for="name in fileNames" :key="name">{{ name }}</li>
        </ul>
      </div>

      <!-- 抓拍预览 -->
      <div class="preview-panel">
        <template v-if="capturedImages.length > 0">
          <button class="nav-btn nav-left" @click="prevPhoto" :disabled="currentIndex === 0" title="上一张">
            <i class="fas fa-chevron-left"></i>
          </button>
          <img :src="capturedImages[currentIndex]" alt="抓拍照片" />
          <button class="nav-btn nav-right" @click="nextPhoto" :disabled="currentIndex === capturedImages.length - 1"
            title="下一张">
            <i class="fas fa-chevron-right"></i>
          </button>
          <button class="delete-btn" @click="deleteCurrentPhoto" title="删除">
            <i class="fas fa-trash"></i>
          </button>
        </template>
        <div class="black-screen" v-else style="height:350px;"></div>
        <!-- 姓名和工号信息条 -->
        <div class="capture-info">
          <span>姓名：{{ currentName || '-' }}</span>
          <span style="margin-left: 32px;">工号：{{ currentJobId || '-' }}</span>
        </div>
      </div>
    </div>

    <canvas ref="canvas"></canvas>
  </div>

  <script>
    // Electron ipcRenderer 兼容处理
    let ipcRenderer = null;
    try {
      ipcRenderer = require && require('electron') ? require('electron').ipcRenderer : null;
    } catch (e) { }

    new Vue({
      el: "#app",
      data: {
        showProgressTable: false,
        progressTableData: [],
        showBasicInfoTable: false,
        basicInfoData: [],
        currentPage: 1,
        totalPages: 1,
        showAddPersonForm: false,
        newPerson: {
          id: 0,
          user_name: '',
          job_num: '',
          dept: '',
          cycle: '周',
          field: '是',
          start_date: '',
          end_date: ''
        },
        editingPerson: {
          id: 0,
          user_name: '',
          job_num: '',
          dept: '',
          cycle: '周',
          field: '是',
          start_date: '',
          end_date: ''
        },
        selectedItems: [], // 用于存储选中的项目ID
        showRegisterDialog: false,
        registerName: '',
        registerJobId: '',
        registerFolderPath: '',
        registerStep: 0, // 0:未注册, 1:正面, 2:侧面, 3:顶部
        registerAngleNames: ['正面', '侧面', '顶部'],
        capturedImages: [],
        currentIndex: 0,
        cameraAvailable: true,
        showFlash: false,
        fileNames: [],
        excelFilePath: '',
        capturedImagePaths: [], // Electron保存图片路径
        showWaitMsg: false,
        currentName: '', // 当前照片姓名
        currentJobId: '', // 当前照片工号
      },
      mounted() {
        this.startCamera();
      },
      methods: {
        async checkPartyInfo() {
          this.currentPage = 1;
          this.showAddPersonForm = false;
          this.editingPerson.id = 0; // 重置编辑状态
          await this.fetchBasicInfo(1);
          this.showBasicInfoTable = true;
        },
        async fetchBasicInfo(page) {
          try {
            const response = await axios.get(`http://127.0.0.1:8080/select_basic_info?page_num=${page}&page_size=10`);
            console.log('获取人员基础信息成功:', response.data);
            this.basicInfoData = response.data.data;
            this.currentPage = response.data.page_num;
            this.totalPages = response.data.total_pages;
          } catch (error) {
            console.error('获取人员基础信息失败:', error);
            alert('获取人员基础信息失败，请检查服务连接');
          }
        },
        async addBasicInfo() {
          try {
            const response = await axios.post('http://127.0.0.1:8080/add_basic_info', this.newPerson);
            
            if (response.data.success) {
              alert('人员信息添加成功');
              // 重置表单
              this.newPerson = {
                id: 0,
                user_name: '',
                job_num: '',
                dept: '',
                cycle: '周',
                field: '是',
                start_date: '',
                end_date: ''
              };
              // 隐藏表单
              this.showAddPersonForm = false;
              // 重新加载数据
              await this.fetchBasicInfo(this.currentPage);
            } else {
              alert('添加失败: ' + response.data.message);
            }
          } catch (error) {
            console.error('添加人员信息失败:', error);
            alert('添加人员信息失败，请检查服务连接');
          }
        },
        startEdit(item) {
          // 深拷贝要编辑的人员信息
          this.editingPerson = {
            id: item.id,
            user_name: item.user_name,
            job_num: item.job_num,
            dept: item.dept,
            cycle: item.cycle,
            field: item.field,
            start_date: item.start_date,
            end_date: item.end_date
          };
        },
        cancelEdit() {
          this.editingPerson.id = 0; // 重置编辑状态
        },
        async updateBasicInfo() {
          try {
            const response = await axios.post('http://127.0.0.1:8080/update_basic_info', this.editingPerson);
            
            if (response.data.success) {
              alert('人员信息更新成功');
              // 重置编辑状态
              this.editingPerson.id = 0;
              // 重新加载数据
              await this.fetchBasicInfo(this.currentPage);
            } else {
              alert('更新失败: ' + response.data.message);
            }
          } catch (error) {
            console.error('更新人员信息失败:', error);
            alert('更新人员信息失败，请检查服务连接');
          }
        },
        // 全选/取消全选
        toggleSelectAll(event) {
          if (event.target.checked) {
            // 全选
            this.selectedItems = this.basicInfoData.map(item => item.id);
          } else {
            // 取消全选
            this.selectedItems = [];
          }
        },
        // 更新全选状态
        updateSelectAllState() {
          // 这个方法会在每次选择项改变时触发，用于保持全选框的状态正确
          // 实际逻辑在模板中的全选框表达式中处理
        },
        // 删除选中的项目
        async deleteSelectedItems() {
          if (this.selectedItems.length === 0) {
            alert('请先选择要删除的项目');
            return;
          }
          
          if (!confirm(`确定要删除选中的 ${this.selectedItems.length} 项吗？`)) {
            return;
          }
          
          try {
            // 循环调用删除接口，每次只传递一个ID
            const deletePromises = this.selectedItems.map(id => 
              axios.delete(`http://127.0.0.1:8080/delete_basic_info?id=${id}`)
            );
            
            // 等待所有删除请求完成
            const results = await Promise.all(deletePromises);
            
            // 合并所有响应结果
            let detailMessage = '';
            results.forEach((result, index) => {
              if (result.data.detail) {
                detailMessage += `ID ${this.selectedItems[index]}: ${result.data.detail}\n`;
              }
            });
            
            // 显示响应结果
            if (detailMessage) {
              alert(detailMessage);
            } else {
              alert('删除成功');
            }
            
            // 清空选中项
            this.selectedItems = [];
            
            // 重新加载数据
            await this.fetchBasicInfo(this.currentPage);
          } catch (error) {
            console.error('删除失败:', error);
            alert('删除失败，请检查服务连接');
          }
        },
        triggerImport() {
          // 触发文件选择
          this.$refs.fileInput.click();
        },
        async handleFileImport(event) {
          const file = event.target.files[0];
          if (!file) {
            return;
          }

          // 检查文件类型
          if (!file.name.endsWith('.xlsx')) {
            alert('请选择xlsx格式的文件');
            event.target.value = ''; // 清空文件输入框
            return;
          }

          // 创建FormData对象
          const formData = new FormData();
          formData.append('file', file);

          try {
            // 发送文件上传请求
            const response = await axios.post('http://127.0.0.1:8080/import_basic_info', formData, {
              headers: {
                'Content-Type': 'multipart/form-data'
              }
            });

            // 显示响应结果
            alert(`${response.data.message}，插入 ${response.data.inserted_count} 条记录`);
            
            // 清空文件输入框
            event.target.value = '';
            
            // 重新加载数据
            await this.fetchBasicInfo(this.currentPage);
          } catch (error) {
            console.error('文件上传失败:', error);
            alert('文件上传失败，请检查服务连接');
            // 清空文件输入框
            event.target.value = '';
          }
        },
        startCamera() {
          navigator.mediaDevices
            .getUserMedia({ video: true })
            .then((stream) => {
              this.$refs.video.srcObject = stream;
              this.cameraAvailable = true;
            })
            .catch((error) => {
              console.warn("摄像头访问失败: ", error);
              this.cameraAvailable = false;
            });
        },
        triggerRegister() {
          this.registerName = '';
          this.registerJobId = '';
          this.showRegisterDialog = true;
          this.registerStep = 0;
        },
        handleFiles(event) {
          const files = event.target.files;
          this.fileNames = Array.from(files).map((file) => file.name);
        },
        cancelRegister() {
          this.showRegisterDialog = false;
        },
        async confirmRegister() {
          if (!this.registerName || !this.registerJobId) {
            alert('请填写姓名和工号');
            return;
          }
          if (!ipcRenderer) {
            alert('请在Electron环境下使用');
            return;
          }
          const folderName = `${this.registerName}-${this.registerJobId}`;
          
          let config = await ipcRenderer.invoke('get-config');
          console.log("获取配置", config.faceDbPath);
          const basePath = config.faceDbPath;
          const folderPath = `${basePath}/${folderName}`;
          try {
            const result = await ipcRenderer.invoke('create-person-folder', folderPath);
            if (result.success) {
              this.registerFolderPath = folderPath;
              this.showRegisterDialog = false;
              this.registerStep = 1; // 进入拍照流程
              alert('请拍摄正面照片');
            } else {
              alert('文件夹创建失败: ' + result.error);
            }
          } catch (e) {
            alert('文件夹创建异常: ' + e.message);
          }
        },
        async checkProgressIdentification() {
          try {
            const response = await axios.get('http://127.0.0.1:8080/read_excel');
            this.progressTableData = response.data.data.map(item => ({
              name: item.姓名,
              jobId: item.工号,
              similarity: item.相似度,
              captureTime: item.抓取时间,
              recognizeTime: item.识别时间,
              imgUrl: 'file:///' + item.图片地址.replace(/\\/g, '/'),
              originUrl: 'file:///' + item.原图地址.replace(/\\/g, '/'),
            }));
          } catch (error) {
            console.error('获取识别情况数据失败:', error);
            alert('获取识别情况数据失败，请检查服务连接');
          }
          this.showProgressTable = true;
        },
        async capturePhoto() {
          if (!this.cameraAvailable) {
            alert("摄像头不可用");
            return;
          }
          this.showFlash = true;
          setTimeout(() => {
            this.showFlash = false;
          }, 300);

          const video = this.$refs.video;
          const canvas = this.$refs.canvas;
          const ctx = canvas.getContext("2d");
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = canvas.toDataURL("image/png");

          // 注册流程：依次保存正面/侧面/顶部
          if (this.registerStep > 0 && this.registerStep <= 3 && this.registerFolderPath) {
            const angleName = this.registerAngleNames[this.registerStep - 1];
            const fileName = angleName + '.png';
            try {
              const res = await ipcRenderer.invoke('save-person-image', {
                folderPath: this.registerFolderPath,
                fileName,
                imageData
              });
              if (res.success) {
                if (this.registerStep < 3) {
                  this.registerStep++;
                  alert('请拍摄' + this.registerAngleNames[this.registerStep - 1] + '照片');
                } else {
                  alert('三张照片已全部采集完成！');
                  this.registerStep = 0;
                  this.registerFolderPath = '';
                }
              } else {
                alert('保存失败: ' + res.error);
              }
            } catch (e) {
              alert('保存异常: ' + e.message);
            }
            return;
          }

          // 普通抓拍流程
          if (ipcRenderer) {
            ipcRenderer.send('save-captured-image', imageData);
          }

          try {
            const url = "http://127.0.0.1:8080/identify_pic";
            const res = await axios.get(url);
            if (res.data && res.data.length === 1 && res.data[0].file_path) {
              let imgPath = res.data[0].file_path.replace(/\\/g, '/');
              if (!imgPath.startsWith('/')) imgPath = '/' + imgPath;
              const imgUrl = `file://${imgPath}`;
              this.capturedImages.push(imgUrl);
              this.currentIndex = this.capturedImages.length - 1;
              this.currentName = res.data[0].name || '';
              this.currentJobId = res.data[0].job_number || '';
            } else if (res.data && res.data.length > 1) {
              alert("检测到多人脸，请重新拍摄！");
            } else {
              alert("未识别到人脸，请重试！");
            }
            console.log(res.data);
          } catch (e) {
            alert("识别接口调用失败，请检查服务！");
          }
        },
        deleteCurrentPhoto() {
          if (this.capturedImages.length === 0) return;
          this.capturedImages.splice(this.currentIndex, 1);
          if (this.currentIndex >= this.capturedImages.length) {
            this.currentIndex = this.capturedImages.length - 1;
          }
          // 删除后清空姓名工号
          if (this.capturedImages.length === 0) {
            this.currentName = '';
            this.currentJobId = '';
          }
        },

        importAttendance() {
          alert("这里可以实现考勤表上传功能");
        },
        downloadExcel() {
          if (!ipcRenderer) {
            alert('请在Electron环境下使用此功能');
            return;
          }
          if (this.excelFilePath === '') {
            alert("请先做人脸对比！");
            return;
          }
          console.log('下载Excel文件:', this.excelFilePath);
          ipcRenderer.invoke('download-excel-file', this.excelFilePath).then(result => {
            if (result.success) {
              const byteChar = atob(result.data);
              const byteNum = byteChar.length;
              const byteArray = new Uint8Array(byteNum);
              for (let i = 0; i < byteNum; i++) {
                byteArray[i] = byteChar.charCodeAt(i);
              }
              const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = result.filename;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            } else {
              alert('下载失败: ' + result.error);
            }
          }).catch(err => {
            alert('下载出错: ' + err.message);
          });
        },
        toggleFullscreen() {
          if (ipcRenderer) {
            ipcRenderer.send('toggle-fullscreen');
          } else {
            alert('请在Electron环境下使用全屏功能');
          }
        },
        prevPhoto() {
          if (this.currentIndex > 0) {
            this.currentIndex--;
          }
        },
        nextPhoto() {
          if (this.currentIndex < this.capturedImages.length - 1) {
            this.currentIndex++;
          }
        },
      },
      watch: {
        showProgressTable(val) {
          if (!val) {
            this.$nextTick(() => {
              this.startCamera();
            });
          }
        },
        showBasicInfoTable(val) {
          if (!val) {
            this.$nextTick(() => {
              this.startCamera();
            });
          }
        }
      },
      async mounted() {
        this.startCamera();
        if (this.excelFilePath === '') {
          try {
            const res2 = await axios.get("http://localhost:8080/download_result");
            this.excelFilePath = res2.data;
          } catch (e) {
            // 请求失败时不影响页面渲染，可选：console.warn 或提示
            console.warn('获取Excel路径失败:', e.message);
            this.excelFilePath = '';
          }
        }
      },
      async created() {
        // Electron主进程图片保存回调
        if (ipcRenderer) {
          ipcRenderer.on('save-captured-image-reply', (event, response) => {
            if (response.success) {
              this.capturedImagePaths.push(response.path);
            } else {
              alert('照片保存失败，请查看控制台日志。');
            }
          });
        }
      }
    });
  </script>
</body>
